name: Rootless build

on:
  push:
    branches: ["TrollPadEx", "main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rootless-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-rootless:
    name: Build rootless package
    runs-on: macos-15-intel
    timeout-minutes: 45

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout TrollPadEx
        uses: actions/checkout@v5

      - name: Restore Theos toolchain cache
        id: theos-cache
        uses: actions/cache@v5
        with:
          path: |
            theos
            ~/.cache/org.llvm.clang
          key: theos-rootless-macos14-${{ runner.arch }}-sdk16.5-clang16-v1
          restore-keys: |
            theos-rootless-macos14-${{ runner.arch }}-sdk16.5-

      - name: Checkout Theos
        if: steps.theos-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: theos/theos
          ref: master
          submodules: recursive
          path: theos

      - name: Checkout iOS SDK
        if: steps.theos-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: theos/sdks
          ref: master
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install build utilities
        uses: dhinakg/procursus-action@main
        with:
          packages: coreutils make xz ldid
          cache: false

      - name: Restore incremental Theos build cache
        uses: actions/cache@v5
        with:
          path: .theos
          key: trollpadex-rootless-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'TrollPadPrefs/Makefile', '**/*.x', '**/*.m', '**/*.h', '**/*.plist', 'control') }}
          restore-keys: |
            trollpadex-rootless-build-${{ runner.os }}-${{ runner.arch }}-

      - name: Build rootless only
        run: |
          set -euo pipefail
          gmake package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload rootless Debian package
        uses: actions/upload-artifact@v6
        with:
          name: TrollPadEx-rootless
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/TrollPadEx' && startsWith(github.event.head_commit.message, 'release: TrollPadEx 2.0.8')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v2.0.8
          target_commitish: ${{ github.sha }}
          name: TrollPadEx 2.0.8 — Rootless
          body: |
            ## TrollPadEx 2.0.8 — Rootless

            Rootless build of TrollPadEx, compiled with Theos on macOS 15 Intel (x86_64).

            ### Package details
            - **Package:** `com.banana.trollpadex`
            - **Version:** `2.0.8`
            - **Architecture:** `iphoneos-arm64`
            - **Minimum firmware dependency:** iOS 14.0
            - **Install type:** Rootless

            ### Installation
            Download the `.deb` asset below and install it using your preferred rootless package manager.

            This release contains only the Rootless package.
          files: packages/*.deb
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
